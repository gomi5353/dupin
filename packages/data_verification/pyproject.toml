[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-verification"
version = "0.1.0"
description = "Verification store for LeRobot datasets: RDF/OWL facts, SHACL + Python verifiers, SPARQL queries."
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "pyarrow",
    "pyshacl>=0.30",
    "rich",
    "rdflib>=7.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
data_verification = ["ontology/*.ttl", "shapes/*.ttl", "axes/*/*.ttl"]
